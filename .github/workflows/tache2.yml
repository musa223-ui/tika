name: Tache 2 - tests tika-core

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - name: Build
        run: ./mvnw -B -pl tika-core -am install -DskipTests -Drat.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true
      - name: Tests tika-core
        run: ./mvnw -B -pl tika-core test -Drat.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  #Version V4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #Version V5.6.0
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.185.0
      - name: Semgrep (nouvelles trouvailles seulement)
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          semgrep scan \
            --config p/java --config p/security-audit --config p/owasp-top-ten \
            --baseline-commit "$BASE" --error
